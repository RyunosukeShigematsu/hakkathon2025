<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register</title>
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
  <h1>新規登録</h1>

  <div class="card row">
    <label>ログインID（名前でOK・他の人と重複しないもの）</label>
    <input id="userId" placeholder="例: 中野蓮賀" autocomplete="username">

    <label>パスワード</label>
    <input id="password" type="password" placeholder="4文字以上" autocomplete="new-password">

    <label>名前</label>
    <input id="name" placeholder="例: 山田太郎" autocomplete="name">

    <label>年齢</label>
    <input id="age" type="number" placeholder="例: 20" min="0" max="120">

    <label>性別</label>
    <select id="gender">
      <option value="unknown">選択しない</option>
      <option value="male">男性</option>
      <option value="female">女性</option>
      <option value="other">その他</option>
    </select>

    <label>タグ（複数選択）</label>
    <div id="tagsBox" class="tags-box"></div>
    <p class="muted">※複数選択OK</p>

    <div class="toolbar">
      <button class="primary" id="saveBtn">登録する</button>
      <a class="btn secondary" href="../index.html">戻る</a>
    </div>

    <p class="muted" id="msg"></p>
  </div>

  <script src="../app.js"></script>
  <script>
    // ★登録API（PHP）に送る
    const API_REGISTER = "https://shigematsu.nkmr.io/hakkathon2025/server/api/user_register.php";

    // クーポンと同じタグ一覧
    const TAG_GROUPS = {
      "ジャンル": ["和食", "洋食", "中華", "イタリアン", "焼肉", "居酒屋", "カフェ", "スイーツ", "エスニック", "定食系", "鉄板系", "肉料理中心"],
      "シーン": ["ひとり向け", "友達と", "デート向き", "ファミリー向け", "学生向け", "社会人向け", "飲み向き", "ランチ向き", "ディナー向き", "二次会向き"],
      "味": ["がっつり", "軽め", "こってり", "あっさり", "濃厚", "さっぱり", "辛い", "甘い", "スパイシー", "チーズ系", "にんにく系", "魚介系"],
      "特徴": ["コスパ重視", "ご褒美系", "ボリューム満点", "ヘルシー志向", "セット充実", "アルコール充実"]
    };

    function renderTags() {
      const box = document.getElementById("tagsBox");
      box.innerHTML = "";

      for (const [group, tags] of Object.entries(TAG_GROUPS)) {
        const h = document.createElement("div");
        h.className = "muted";
        h.style.width = "100%";
        h.style.marginTop = "6px";
        h.textContent = group;
        box.appendChild(h);

        for (const tag of tags) {
          const label = document.createElement("label");
          label.className = "tag-item";

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.value = tag;
          cb.className = "tagCheck";

          const span = document.createElement("span");
          span.textContent = tag;

          label.appendChild(cb);
          label.appendChild(span);
          box.appendChild(label);
        }
      }
    }

    function getSelectedTags() {
      return Array.from(document.querySelectorAll(".tagCheck:checked")).map(el => el.value);
    }

    function setMsg(text) {
      qs("#msg").textContent = text || "";
    }

    on("#saveBtn", "click", async () => {
      setMsg("");

      const userId = qs("#userId").value.trim();
      const password = qs("#password").value;
      const name = qs("#name").value.trim();
      const ageRaw = qs("#age").value;
      const age = ageRaw === "" ? null : Number(ageRaw);
      const gender = qs("#gender").value;

      const tags = getSelectedTags(); // ★ここが新しい

      if (!userId) { alert("ユーザーIDを入力してください"); return; }
      if (!password || password.length < 4) { alert("パスワードは4文字以上にしてください"); return; }
      if (age !== null && (Number.isNaN(age) || age < 0 || age > 120)) { alert("年齢の値が不正です"); return; }

      const btn = qs("#saveBtn");
      btn.disabled = true;
      btn.style.opacity = 0.6;
      setMsg("登録中…");

      try {
        const res = await fetch(API_REGISTER, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            password,
            name,
            age,
            gender,
            tags   // ★preferencesじゃなくtags
          })
        });

        const json = await res.json().catch(() => null);

        if (!res.ok) {
          const message = (json && json.message) ? json.message : "登録に失敗しました";
          alert(message);
          setMsg(message);
          return;
        }

        location.href = "../index.html";
      } catch (e) {
        console.error(e);
        alert("通信に失敗しました（サーバに到達できません）");
        setMsg("通信に失敗しました");
      } finally {
        btn.disabled = false;
        btn.style.opacity = 1;
      }
    });

    // init
    renderTags();
  </script>
</body>

</html>
