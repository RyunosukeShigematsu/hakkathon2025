<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop - 分析</title>

  <!-- 店舗側の既存デザインに合わせる -->
  <link rel="stylesheet" href="../customer/style.css" />

  <style>
    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      gap: 12px;
    }

    .shop-id {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    .muted {
      color: #666;
      font-size: 13px;
    }

    .target-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .target-item:active {
      transform: scale(0.995);
      opacity: 0.9;
    }

    .target-left {
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .target-title {
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-sub {
      margin-top: 3px;
      font-size: 12px;
      color: #777;
    }

    /* modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 9999;
    }

    .modal {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 16px;
      border: 1px solid #eee;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0;
      line-height: 1.3;
    }

    .modal-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #777;
    }

    .icon-btn {
      border: 1px solid #eee;
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(0.98);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .kpi {
      background: #f7f7f7;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 12px;
    }

    .kpi .label {
      font-size: 12px;
      color: #666;
    }

    .kpi .value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
    }

    .bar-wrap {
      background: #eee;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #007aff;
      transition: width .5s ease;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #eee;
      background: #fff;
      color: #333;
    }

    .chip .c {
      color: #666;
      margin-left: 6px;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div>
      <h1 style="margin:0;">利用状況の分析</h1>
      <div id="shopDisplay" class="shop-id"></div>
    </div>
    <a href="home.html" class="btn secondary">ホームに戻る</a>
  </div>

  <p class="muted">
    この店舗の「クーポン候補（商品カテゴリ）」一覧です。<br>
    クリックすると、表示回数・選択回数・選択率と、選択した人の特徴を確認できます。
  </p>

  <div class="analysis-grid">
    <div class="card">
      <h3>🗂 クーポン候補（商品カテゴリ）一覧</h3>
      <div id="targetsList"></div>
    </div>
  </div>

  <!-- modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <div style="min-width:0;">
          <p id="modalTitle" class="modal-title"></p>
          <div id="modalSub" class="modal-sub"></div>
        </div>
        <button id="modalCloseBtn" class="icon-btn">閉じる</button>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="label">表示回数</div>
          <div id="kpiImpressions" class="value">-</div>
        </div>
        <div class="kpi">
          <div class="label">選択回数</div>
          <div id="kpiSelections" class="value">-</div>
        </div>
      </div>

      <div class="kpi" style="margin-top:10px;">
        <div class="label">選択率（CTR）</div>
        <div id="kpiCtr" class="value">-</div>
        <div class="bar-wrap">
          <div id="ctrBar" class="bar"></div>
        </div>
      </div>

      <div class="kpi" style="margin-top:10px;">
        <div class="label">選択した人の特徴</div>

        <div class="insight-row">
          <div class="insight-box">
            <div class="chart-title">性別</div>
            <div id="genderDonut"></div>
          </div>

          <div class="insight-box" style="flex:1;">
            <div class="chart-title">年齢（分布）</div>
            <div id="ageStrip"></div>
          </div>
        </div>

        <div style="margin-top:10px;">
          <div class="chart-title">おすすめターゲット（好みタグ 上位）</div>
          <div id="tagPills"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const KEY_SHOP_SESSION = "hk_shop_session_v1";

    // 既に動いているカテゴリ一覧API
    const API_TARGETS = "https://shigematsu.nkmr.io/hakkathon2025/server/api/shop_targets_list.php";

    // 集計API
    const API_TARGET_STATS = "https://shigematsu.nkmr.io/hakkathon2025/server/api/shop_get_analysis.php";

    function safeParse(raw, fallback) {
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    }

    // ログインチェック
    const session = safeParse(localStorage.getItem(KEY_SHOP_SESSION), null);
    if (!session || !session.shopId) location.href = "./index.html";

    const SHOP_ID = session.shopId;
    const SHOP_NAME = session.shopName || "";
    const GENRE = session.genre || "";

    const namePart = SHOP_NAME ? (" / " + SHOP_NAME) : "";
    const genrePart = GENRE ? ("（" + GENRE + "）") : "";
    document.getElementById("shopDisplay").textContent = "店舗ID: " + SHOP_ID + namePart + genrePart;

    async function fetchTargets() {
      const res = await fetch(API_TARGETS, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ shop_id: SHOP_ID })
      });

      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (e) {
        console.log("targets raw:", text);
        return { ok: false, items: [] };
      }
      if (!json.ok || !Array.isArray(json.items)) return { ok: false, items: [] };
      return { ok: true, items: json.items };
    }

    async function fetchTargetStats(targetId) {
      const res = await fetch(API_TARGET_STATS, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ shop_id: SHOP_ID, target_id: targetId })
      });

      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (e) {
        console.log("stats raw:", text);
        throw new Error("集計APIの返答がJSONではありません");
      }

      if (!json.ok) {
        const msg = json.message || "集計APIエラー";
        const detail = json.detail ? (" / " + JSON.stringify(json.detail)) : "";
        throw new Error(msg + detail);
      }
      return json;
    }

    // modal
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalCloseBtn = document.getElementById("modalCloseBtn");

    function openModal(title, sub, impressions, selections, ctr) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalSub").textContent = sub;

      document.getElementById("kpiImpressions").textContent = String(impressions);
      document.getElementById("kpiSelections").textContent = String(selections);

      const ctrNum = Number(ctr || 0);
      document.getElementById("kpiCtr").textContent = (ctrNum * 100).toFixed(1) + "%";

      const pct = Math.max(0, Math.min(100, Math.round(ctrNum * 100)));
      document.getElementById("ctrBar").style.width = pct + "%";

      modalBackdrop.style.display = "flex";
    }

    function closeModal() {
      modalBackdrop.style.display = "none";
    }

    modalCloseBtn.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    // ===== 可視化（省スペース版） =====
    function sumObj(obj) {
      return Object.values(obj || {}).reduce((a, v) => a + Number(v || 0), 0);
    }

    function topKey(obj) {
      let bestK = "unknown", bestV = -1;
      for (const k in (obj || {})) {
        const v = Number(obj[k] || 0);
        if (v > bestV) { bestV = v; bestK = k; }
      }
      return bestK;
    }

    // 視認性のために固定色（CSSに書いてもOK）
    const G_COL = { male: "#2F80ED", female: "#EB5757", other: "#9B51E0", unknown: "#BDBDBD" };
    const A_COL = { "-19": "#2D9CDB", "20s": "#27AE60", "30s": "#F2C94C", "40s": "#F2994A", "50+": "#EB5757", "unknown": "#BDBDBD" };

    function renderDonut(elId, counts) {
      const el = document.getElementById(elId);
      const total = sumObj(counts);
      if (!total) { el.innerHTML = "<div class='muted'>データなし</div>"; return; }

      const main = topKey(counts); // 最大の属性
      const r = 18, cx = 22, cy = 22, stroke = 8;
      const C = 2 * Math.PI * r;

      const order = ["male", "female", "other", "unknown"];
      let acc = 0;

      const circles = order.map(k => {
        const v = Number(counts[k] || 0);
        const frac = v / total;
        const dash = frac * C;
        const offset = C - acc;
        acc += dash;
        return `
        <circle r="${r}" cx="${cx}" cy="${cy}"
          fill="transparent"
          stroke="${G_COL[k]}"
          stroke-width="${stroke}"
          stroke-dasharray="${dash} ${C - dash}"
          stroke-dashoffset="${offset}"
          transform="rotate(-90 ${cx} ${cy})"
        />`;
      }).join("");

      el.innerHTML = `
      <div class="donutWrap">
        <svg width="44" height="44" viewBox="0 0 44 44" aria-label="gender donut">
          <circle r="${r}" cx="${cx}" cy="${cy}" fill="transparent" stroke="#eee" stroke-width="${stroke}" />
          ${circles}
          <text x="22" y="25" text-anchor="middle" font-size="10" fill="#444" font-weight="700">${main}</text>
        </svg>
        <div class="donutText">
          male ${counts.male || 0} / female ${counts.female || 0}<br/>
          other ${counts.other || 0} / unk ${counts.unknown || 0}
        </div>
      </div>
    `;
    }

    function renderAgeStrip(stats) {
      const el = document.getElementById("ageStrip");
      const a = stats.ageBuckets || {};
      const total = Number(stats.selections || 0);
      if (!total) { el.innerHTML = "<div class='muted'>データなし</div>"; return; }

      const order = ["-19", "20s", "30s", "40s", "50+", "unknown"];
      const segs = order.map(k => {
        const v = Number(a[k] || 0);
        const w = Math.max(0, (v / total) * 100);
        return `<div class="seg" style="width:${w}%; background:${A_COL[k]};"></div>`;
      }).join("");

      const legend = order.map(k => {
        const v = Number(a[k] || 0);
        return `<span class="leg"><span class="dot" style="background:${A_COL[k]}"></span>${k} ${v}</span>`;
      }).join("");

      el.innerHTML = `
      <div class="strip">${segs}</div>
      <div class="legend">${legend}</div>
    `;
    }

    function renderTagPills(stats) {
      const el = document.getElementById("tagPills");
      const tags = Array.isArray(stats.topTags) ? stats.topTags : [];
      if (!tags.length) { el.innerHTML = "<div class='muted'>データなし</div>"; return; }

      // デモは5個くらいが最も読みやすい
      const top = tags.slice(0, 5);

      el.innerHTML = `
      <div class="pills">
        ${top.map(t => `
          <span class="pill">
            <b>${String(t.tag || "")}</b>
            <span class="n">${Number(t.count || 0)}</span>
          </span>
        `).join("")}
      </div>
    `;
    }

    // ---- ここが可視化の中心 ----
    function renderAttr(stats) {
      const totalSel = Number(stats.selections || 0);
      if (!totalSel) {
        document.getElementById("genderDonut").innerHTML = "<div class='muted'>データなし</div>";
        document.getElementById("ageStrip").innerHTML = "<div class='muted'>データなし</div>";
        document.getElementById("tagPills").innerHTML = "<div class='muted'>データなし</div>";
        return;
      }

      renderDonut("genderDonut", stats.genderCounts || {});
      renderAgeStrip(stats);
      renderTagPills(stats);
    }

    function renderTargets(items) {
      const el = document.getElementById("targetsList");

      if (!items || items.length === 0) {
        el.innerHTML = "<p class='muted'>候補がありません（coupon_targetsが未登録 or shop_idが違う可能性）</p>";
        return;
      }

      el.innerHTML = items.map(function (t) {
        return (
          "<div class='target-item' data-target-id='" + t.target_id + "' data-target-name='" + t.target_name + "'>" +
          "  <div class='target-left'>" +
          "    <div class='target-title'>" + t.target_name + "</div>" +
          "    <div class='target-sub'>" + t.target_id + "</div>" +
          "  </div>" +
          "</div>"
        );
      }).join("");

      Array.prototype.forEach.call(el.querySelectorAll(".target-item"), function (row) {
        row.addEventListener("click", async function () {
          const targetId = row.getAttribute("data-target-id") || "";
          const targetName = row.getAttribute("data-target-name") || "";

          // ローディング（新しいIDに合わせる）
          openModal(targetName, targetId, "-", "-", 0);
          document.getElementById("genderDonut").innerHTML = "<div class='muted'>読み込み中...</div>";
          document.getElementById("ageStrip").innerHTML = "";
          document.getElementById("tagPills").innerHTML = "";

          try {
            const stats = await fetchTargetStats(targetId);
            openModal(
              targetName,
              targetId,
              stats.impressions || 0,
              stats.selections || 0,
              stats.ctr || 0
            );
            renderAttr(stats);
          } catch (e) {
            document.getElementById("genderDonut").innerHTML = "<div class='muted'>取得に失敗しました</div>";
            document.getElementById("ageStrip").innerHTML = "";
            document.getElementById("tagPills").innerHTML =
              "<div class='muted'>" + String(e.message || e) + "</div>";
          }
        });
      });
    }

    async function init() {
      const r = await fetchTargets();
      renderTargets(r.ok ? r.items : []);
    }

    init();
  </script>

</body>

</html>
